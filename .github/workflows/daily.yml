# Доска направления: раз в сутки тянет свежие числа и перевыкладывает страницу.
#
# Четыре вещи, ради которых он написан именно так.
#
# 1. Ключа не существует. Организация запрещает создавать ключи служебных
#    аккаунтов, и это правильно: скачанный ключ живёт вечно. Вместо ключа —
#    федерация: GitHub предъявляет свой OIDC-токен, Google меняет его на
#    временный. В репозитории нет ни одного секрета, и ротировать нечего.
# 2. «Не настроено» и «сломалось» — РАЗНЫЕ исходы. Если личности нет вообще,
#    fetch.py выходит с кодом 2, бот идёт дальше и пересобирает доску на
#    прежних данных, а страница печатает их прежнюю дату. Любой другой
#    ненулевой код — настоящий сбой, и он роняет прогон.
# 3. Данные не переписываются пустотой: это правило живёт в fetch.py, но
#    здесь оно тоже важно — коммит делается ТОЛЬКО если файлы изменились,
#    иначе история засоряется пустыми правками.
# 4. Доверие сужено до одного репозитория: условие провайдера пускает только
#    владельца bilingoplusllc, а право выступать от имени служебного аккаунта
#    выдано принципалу attribute.repository = bilingoplusllc/web-properties.
name: daily board

on:
  schedule:
    - cron: "17 5 * * *"     # 05:17 UTC ежедневно
  workflow_dispatch:          # и вручную, кнопкой

permissions:
  contents: write
  pages: write
  id-token: write             # без этого GitHub не выдаст OIDC-токен

concurrency:
  group: board
  cancel-in-progress: false

env:
  WIF_PROVIDER: projects/344965276479/locations/global/workloadIdentityPools/github/providers/gh-actions
  WIF_ACCOUNT: board-fetch@bilingoplus-board.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: библиотеки только для загрузчика
        run: pip install --quiet google-auth requests

      # Обмен OIDC-токена GitHub на временную личность Google. Шаг кладёт
      # файл учётных данных и указывает на него переменной окружения —
      # fetch.py находит его через google.auth.default() и не знает, откуда
      # взялась личность. Постоянного секрета в этом файле нет.
      - name: личность Google без ключа
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_ACCOUNT }}

      - name: свежие числа
        id: fetch
        run: |
          if [ "${{ steps.auth.outcome }}" != "success" ]; then
            echo "личность не выдана — доска соберётся на прежних данных"
            echo "configured=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python dashboard/fetch.py
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "личности нет — доска соберётся на прежних данных"
            echo "configured=no" >> "$GITHUB_OUTPUT"
          elif [ "$code" != "0" ]; then
            echo "загрузчик упал с кодом $code"
            exit "$code"
          else
            echo "configured=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: собрать доску
        run: |
          cd dashboard
          python build_web_board.py
          python build_hub.py

      - name: выложить в docs
        run: |
          mkdir -p docs
          cp dashboard/board.html docs/index.html
          cp dashboard/hub.html docs/hub.html
          touch docs/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > docs/robots.txt
          python - <<'PY'
          # Страница публичная по решению владельца, но в поиске ей делать
          # нечего: это внутренняя доска. robots.txt просит не обходить,
          # мета-тег просит не индексировать — вторая половина нужна потому,
          # что страницу, на которую кто-то сослался, Google может показать
          # и не обходя её.
          import io, re
          for p in ("docs/index.html", "docs/hub.html"):
              t = io.open(p, encoding="utf-8").read()
              if "name=\"robots\"" in t:
                  continue
              t = re.sub(r"(<head[^>]*>)",
                         r'\1<meta name="robots" content="noindex,nofollow">',
                         t, count=1)
              io.open(p, "w", encoding="utf-8", newline="\n").write(t)
              print("noindex ->", p)
          PY

      # Коммит НАЗЫВАЕТ, что произошло. Раньше он всегда говорил «свежие
      # числа», в том числе на прогонах, где загрузка не отработала: страница
      # всё равно менялась (в ней стоит дата), коммит проходил, и по истории
      # отличить «сходил за числами» от «не сходил» было нельзя.
      - name: закоммитить, если изменилось
        run: |
          git config user.name "board bot"
          git config user.email "bot@users.noreply.github.com"
          git add dashboard/data docs
          if git diff --cached --quiet; then
            echo "ничего не изменилось — коммита нет"
          else
            if [ "${{ steps.fetch.outputs.configured }}" = "yes" ]; then
              git commit -m "доска: свежие числа $(date -u +%F)"
            else
              git commit -m "доска: пересобрана БЕЗ свежих чисел $(date -u +%F)"
            fi
            git push
          fi

      # И прогон без чисел должен быть ВИДЕН в списке прогонов, а не только в
      # логе, который открывают лишь у красных.
      - name: пометить прогон без свежих чисел
        if: steps.fetch.outputs.configured != 'yes'
        run: |
          {
            echo "### Доска пересобрана БЕЗ свежих чисел"
            echo ""
            echo "Личность Google не выдана или загрузчик вернул «не настроено»."
            echo "Числа на странице прежние, и страница печатает их прежнюю дату"
            echo "и возраст: «данные не обновлялись N сут.»"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
